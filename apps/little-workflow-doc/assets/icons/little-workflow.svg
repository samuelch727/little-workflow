<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Little Workflow animated eyes avatar">
  <style>
    .workflow-gaze { animation: workflow-look 12s ease-in-out infinite; }
    .workflow-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: workflow-expression 12s ease-in-out infinite;
    }
    @keyframes workflow-look {
      0.0000% { transform: translate(0px, 0px); }
      14.1667% { transform: translate(0px, 0px); }
      16.6667% { transform: translate(0.9px, -0.9px); }
      27.5000% { transform: translate(0.9px, -0.9px); }
      30.8333% { transform: translate(0.9px, 0.9px); }
      38.7500% { transform: translate(0.9px, 0.9px); }
      41.6667% { transform: translate(0px, 0px); }
      65.0000% { transform: translate(0px, 0px); }
      67.9167% { transform: translate(0.9px, -0.6px); }
      73.3333% { transform: translate(0.9px, -0.6px); }
      76.2500% { transform: translate(0px, 0px); }
      100.0000% { transform: translate(0px, 0px); }
    }
    @keyframes workflow-expression {
      0.0000% { transform: scale(1, 1); }
      9.3333% { transform: scale(1, 1); }
      10.1333% { transform: scale(1.12, 0.16); }
      10.5333% { transform: scale(1.12, 0.16); }
      11.3333% { transform: scale(1, 1); }
      12.5000% { transform: scale(1, 1); }
      13.3000% { transform: scale(1.12, 0.16); }
      13.7000% { transform: scale(1.12, 0.16); }
      14.5000% { transform: scale(1, 1); }
      50.0000% { transform: scale(1, 1); }
      50.8000% { transform: scale(1.12, 0.16); }
      51.2000% { transform: scale(1.12, 0.16); }
      52.0000% { transform: scale(1, 1); }
      65.4167% { transform: scale(1, 1); }
      67.5000% { transform: scale(1.05, 1.13); }
      74.1667% { transform: scale(1.05, 1.13); }
      76.6667% { transform: scale(1, 1); }
      85.8333% { transform: scale(1, 1); }
      86.6333% { transform: scale(1.12, 0.16); }
      87.0333% { transform: scale(1.12, 0.16); }
      87.8333% { transform: scale(1, 1); }
      100.0000% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .workflow-gaze, .workflow-eye { animation: none; }
    }
