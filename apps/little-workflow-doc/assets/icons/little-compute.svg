<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Little Compute animated eyes avatar">
  <style>
    .compute-gaze { animation: compute-look 12s ease-in-out infinite; }
    .compute-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: compute-expression 12s ease-in-out infinite;
    }
    @keyframes compute-look {
      0.0000% { transform: translate(0px, 0px); }
      4.1667% { transform: translate(0px, 0px); }
      6.6667% { transform: translate(-1.25px, 0px); }
      13.3333% { transform: translate(-1.25px, 0px); }
      15.8333% { transform: translate(1.25px, 0px); }
      22.5000% { transform: translate(1.25px, 0px); }
      25.0000% { transform: translate(0px, 0px); }
      47.5000% { transform: translate(0px, 0px); }
      50.0000% { transform: translate(0px, -0.8px); }
      56.6667% { transform: translate(0px, -0.8px); }
      59.1667% { transform: translate(0px, 0px); }
      72.5000% { transform: translate(0px, 0px); }
      75.0000% { transform: translate(-0.8px, 0px); }
      80.4167% { transform: translate(-0.8px, 0px); }
      82.9167% { transform: translate(0px, 0px); }
      100.0000% { transform: translate(0px, 0px); }
    }
    @keyframes compute-expression {
      0.0000% { transform: scale(1, 1); }
      2.9167% { transform: scale(1, 1); }
      3.7500% { transform: scale(1.12, 0.16); }
      4.1667% { transform: scale(1.12, 0.16); }
      5.0000% { transform: scale(1, 1); }
      29.5833% { transform: scale(1, 1); }
      30.4167% { transform: scale(1.12, 0.16); }
      30.8333% { transform: scale(1.12, 0.16); }
      31.6667% { transform: scale(1, 1); }
      34.1667% { transform: scale(1, 1); }
      36.6667% { transform: scale(1.12, 1.3); }
      42.9167% { transform: scale(1.12, 1.3); }
      45.8333% { transform: scale(1, 1); }
      65.0000% { transform: scale(1, 1); }
      65.8333% { transform: scale(1.12, 0.16); }
      66.2500% { transform: scale(1.12, 0.16); }
      67.0833% { transform: scale(1, 1); }
      68.3333% { transform: scale(1, 1); }
      69.1667% { transform: scale(1.12, 0.16); }
      69.5833% { transform: scale(1.12, 0.16); }
      70.4167% { transform: scale(1, 1); }
      88.3333% { transform: scale(1, 1); }
      89.1667% { transform: scale(1.12, 0.16); }
      89.5833% { transform: scale(1.12, 0.16); }
      90.4167% { transform: scale(1, 1); }
      100.0000% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .compute-gaze, .compute-eye { animation: none; }
    }
  </style>
  <path fill="#30729A" d="M16.5 8h15a8.5 8.5 0 0 1 8.5 8.5v15a8.5 8.5 0 0 1-8.5 8.5h-15A8.5 8.5 0 0 1 8 31.5v-15A8.5 8.5 0 0 1 16.5 8Z" />
  <path fill="none" stroke="#65A6D1" stroke-width="6" stroke-linecap="round" d="M24 6v5m0 26v5M6 24h5m26 0h5" />
  <path fill="#9ACDEE" d="M18.75 14.75h10.5a4.5 4.5 0 0 1 4.5 4.5v9.5a4.5 4.5 0 0 1-4.5 4.5h-10.5a4.5 4.5 0 0 1-4.5-4.5v-9.5a4.5 4.5 0 0 1 4.5-4.5Z" />
  <g transform="translate(24 24)" fill="#214763">
