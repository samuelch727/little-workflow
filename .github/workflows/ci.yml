name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.27.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Qualify packed setup CLI in clean projects
        run: |
          pack_dir="${RUNNER_TEMP}/little-setup-packs"
          mkdir -p "${pack_dir}"
          pnpm --filter little-workflow pack --pack-destination "${pack_dir}"
          package_version="$(node -p "require('./packages/little-workflow/package.json').version")"
          node scripts/verify-little-setup.mjs --tarball "${pack_dir}/little-workflow-${package_version}.tgz" --managers npm,pnpm
