<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Little Stack animated eyes avatar">
  <style>
    .stack-gaze { animation: stack-look 12s ease-in-out infinite; }
    .stack-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: stack-expression 12s ease-in-out infinite;
    }
    @keyframes stack-look {
      0.0000% { transform: translate(0px, 0px); }
      14.1667% { transform: translate(0px, 0px); }
      16.6667% { transform: translate(-1.15px, 0.15px); }
      26.6667% { transform: translate(-1.15px, 0.15px); }
      29.1667% { transform: translate(0px, 0px); }
      43.3333% { transform: translate(0px, 0px); }
      46.2500% { transform: translate(1.05px, -0.2px); }
      55.4167% { transform: translate(1.05px, -0.2px); }
      57.9167% { transform: translate(0px, 0px); }
      75.8333% { transform: translate(0px, 0px); }
      78.7500% { transform: translate(-0.35px, -0.6px); }
      86.2500% { transform: translate(-0.35px, -0.6px); }
      88.7500% { transform: translate(0px, 0px); }
      100.0000% { transform: translate(0px, 0px); }
    }
    @keyframes stack-expression {
      0.0000% { transform: scale(1, 1); }
      9.5833% { transform: scale(1, 1); }
      10.5167% { transform: scale(1.12, 0.16); }
      10.9833% { transform: scale(1.12, 0.16); }
      11.9167% { transform: scale(1, 1); }
      34.1667% { transform: scale(1, 1); }
      35.1000% { transform: scale(1.12, 0.16); }
      35.5667% { transform: scale(1.12, 0.16); }
      36.5000% { transform: scale(1, 1); }
      66.6667% { transform: scale(1, 1); }
      68.7500% { transform: scale(1.12, 0.16); }
      70.2500% { transform: scale(1.12, 0.16); }
      72.5000% { transform: scale(1, 1); }
      93.3333% { transform: scale(1, 1); }
      94.2667% { transform: scale(1.12, 0.16); }
      94.7333% { transform: scale(1.12, 0.16); }
      95.6667% { transform: scale(1, 1); }
      100.0000% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stack-gaze, .stack-eye { animation: none; }
    }
  </style>
