<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Little Harness animated eyes avatar">
  <style>
    .harness-gaze { animation: harness-look 12s ease-in-out infinite; }
    .harness-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: harness-expression 12s ease-in-out infinite;
    }
    .harness-right { animation-name: harness-wink; }
    @keyframes harness-look {
      0.0000% { transform: translate(0px, 0px); }
      8.3333% { transform: translate(0px, 0px); }
      10.8333% { transform: translate(0.5px, -0.65px); }
      17.5000% { transform: translate(0.5px, -0.65px); }
      20.0000% { transform: translate(0px, 0px); }
      33.3333% { transform: translate(0px, 0px); }
      35.4167% { transform: translate(-0.7px, 0.15px); }
      45.8333% { transform: translate(-0.7px, 0.15px); }
      48.3333% { transform: translate(0px, 0px); }
      72.5000% { transform: translate(0px, 0px); }
      75.0000% { transform: translate(0.8px, 0px); }
      85.0000% { transform: translate(0.8px, 0px); }
      87.5000% { transform: translate(0px, 0px); }
      100.0000% { transform: translate(0px, 0px); }
    }
    @keyframes harness-expression {
      0.0000% { transform: scale(1, 1); }
      4.5833% { transform: scale(1, 1); }
      5.5167% { transform: scale(1.12, 0.16); }
      5.9833% { transform: scale(1.12, 0.16); }
      6.9167% { transform: scale(1, 1); }
      55.8333% { transform: scale(1, 1); }
      56.7667% { transform: scale(1.12, 0.16); }
      57.2333% { transform: scale(1.12, 0.16); }
      58.1667% { transform: scale(1, 1); }
      91.2500% { transform: scale(1, 1); }
      92.1833% { transform: scale(1.12, 0.16); }
      92.6500% { transform: scale(1.12, 0.16); }
      93.5833% { transform: scale(1, 1); }
      100.0000% { transform: scale(1, 1); }
    }
    @keyframes harness-wink {
      0.0000% { transform: scale(1, 1); }
      4.5833% { transform: scale(1, 1); }
      5.5167% { transform: scale(1.12, 0.16); }
      5.9833% { transform: scale(1.12, 0.16); }
      6.9167% { transform: scale(1, 1); }
      26.6667% { transform: scale(1, 1); }
      28.1667% { transform: scale(1.12, 0.16); }
      30.0000% { transform: scale(1.12, 0.16); }
      31.5000% { transform: scale(1, 1); }
      55.8333% { transform: scale(1, 1); }
      56.7667% { transform: scale(1.12, 0.16); }
      57.2333% { transform: scale(1.12, 0.16); }
      58.1667% { transform: scale(1, 1); }
      91.2500% { transform: scale(1, 1); }
      92.1833% { transform: scale(1.12, 0.16); }
      92.6500% { transform: scale(1.12, 0.16); }
      93.5833% { transform: scale(1, 1); }
      100.0000% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .harness-gaze, .harness-eye { animation: none; }
    }
  </style>
  <path fill="none" stroke="#2B7751" stroke-width="6.6" stroke-linecap="round" d="M15 10h-1.25a6 6 0 0 0-6 6v16a6 6 0 0 0 6 6H15m18-28h1.25a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6H33" />
  <path fill="#A6CD7C" d="M22.55 15.4q1.45-3.7 2.9 0c1.1 3.6 3.55 6.05 7.15 7.15q3.7 1.45 0 2.9c-3.6 1.1-6.05 3.55-7.15 7.15q-1.45 3.7-2.9 0c-1.1-3.6-3.55-6.05-7.15-7.15q-3.7-1.45 0-2.9c3.6-1.1 6.05-3.55 7.15-7.15Z" />
  <g transform="translate(24 24)" fill="#233F2D">
    <g class="harness-gaze">
      <ellipse class="harness-eye harness-left" cx="-2.8" cy="0" rx="1.12" ry="1.65"/>
      <ellipse class="harness-eye harness-right" cx="2.8" cy="0" rx="1.12" ry="1.65"/>
    </g>
  </g>
