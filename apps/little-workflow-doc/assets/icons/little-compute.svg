      <ellipse class="compute-eye compute-left" cx="-3.65" cy="0" rx="1.45" ry="2.05"/>
      <ellipse class="compute-eye compute-right" cx="3.65" cy="0" rx="1.45" ry="2.05"/>
    </g>
  </g>
</svg>
