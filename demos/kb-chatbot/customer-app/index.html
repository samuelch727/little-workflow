<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind Helpdesk</title>
<style>
  :root { --brand:#0f766e; --brand-soft:#e6f2f1; --ink:#1a2b2a; --mut:#6b7a78; --bg:#f6f8f8; }
  * { box-sizing:border-box; margin:0 }
  body { font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh }
  header { background:#fff; border-bottom:1px solid #e3e9e8; padding:14px 22px; display:flex; align-items:center; gap:12px }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--brand); color:#fff; display:grid;
          place-items:center; font-weight:700; font-size:15px }
  header h1 { font-size:16px; font-weight:650 } header p { font-size:12.5px; color:var(--mut) }
  #chat { flex:1; overflow-y:auto; padding:26px 0 }
  .row { max-width:760px; margin:0 auto 16px; padding:0 22px; display:flex; gap:10px }
  .row.me { justify-content:flex-end }
  .bubble { max-width:78%; padding:11px 15px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word }
  .me .bubble { background:var(--brand); color:#fff; border-bottom-right-radius:4px }
  .bot .bubble { background:#fff; border:1px solid #e3e9e8; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.04) }
  .bot .avatar { width:30px; height:30px; border-radius:50%; background:var(--brand-soft); color:var(--brand);
                 display:grid; place-items:center; font-size:14px; flex:none; margin-top:2px }
  .bubble .src { display:inline-block; margin-top:8px; font-size:12px; color:var(--brand); background:var(--brand-soft);
                 padding:2px 9px; border-radius:99px; font-weight:600 }
  .fb { display:flex; gap:6px; margin-top:8px }
  .fb button { border:1px solid #e3e9e8; background:#fff; border-radius:99px; padding:2px 10px; cursor:pointer;
               font-size:13px; transition:.15s }
  .fb button:hover { border-color:var(--brand) }
  .fb button.on { background:var(--brand-soft); border-color:var(--brand) }
  .file-chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; background:rgba(255,255,255,.18);
               padding:3px 10px; border-radius:99px; margin-bottom:6px }
  .typing { color:var(--mut); font-size:13px; padding-left:4px }
  .typing i { animation:blink 1.2s infinite; font-style:normal }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  footer { background:#fff; border-top:1px solid #e3e9e8; padding:14px 22px }
  .composer { max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:center }
  .composer input[type=text] { flex:1; border:1px solid #dbe3e2; border-radius:12px; padding:11px 15px; font:inherit;
                               outline:none } .composer input[type=text]:focus { border-color:var(--brand) }
  .icon-btn { width:42px; height:42px; border-radius:12px; border:1px solid #dbe3e2; background:#fff; cursor:pointer;
              display:grid; place-items:center; font-size:17px } .icon-btn:hover { border-color:var(--brand) }
  .send { background:var(--brand); color:#fff; border:none; border-radius:12px; padding:0 20px; height:42px;
          font:600 14px system-ui; cursor:pointer } .send:disabled { opacity:.5 }
  #pending-file { max-width:760px; margin:0 auto 8px; font-size:12.5px; color:var(--brand); display:none }
</style>
<header>
  <div class="logo">N</div>
  <div><h1>Northwind Helpdesk</h1><p>Ask about company policies — or drop in a document to teach me something new.</p></div>
</header>
<div id="chat"></div>
<footer>
  <div id="pending-file"></div>
  <div class="composer">
    <button class="icon-btn" id="attach" title="Attach a document">📎</button>
    <input type="file" id="file" hidden accept=".md,.txt">
    <input type="text" id="msg" placeholder="Ask a question…" autofocus>
    <button class="send" id="send">Send</button>
  </div>
</footer>
<script>
  const threadId = "web-" + Math.random().toString(36).slice(2, 8);
  const chat = document.getElementById("chat"), msg = document.getElementById("msg"),
        send = document.getElementById("send"), fileIn = document.getElementById("file"),
        pend = document.getElementById("pending-file");
  let pendingFile = null;

  document.getElementById("attach").onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; if (!f) return;
    const buf = new Uint8Array(await f.arrayBuffer());
    let bin = ""; buf.forEach(b => bin += String.fromCharCode(b));
    pendingFile = { name: f.name, mimeType: f.type || "text/markdown", dataBase64: btoa(bin) };
    pend.style.display = "block"; pend.textContent = "📎 " + f.name + " attached — will be sent with your next message";
  };

  function add(kind, html) {
    const row = document.createElement("div"); row.className = "row " + kind;
    row.innerHTML = (kind === "bot" ? '<div class="avatar">🏛️</div>' : "") + '<div class="bubble">' + html + "</div>";
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight; return row;
  }
  const esc = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function renderReply(text) {
    let t = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    t = t.replace(/Source:\s*([\w.\-]+)/g, '<span class="src">📄 $1</span>');
    return t;
  }

  async function submit() {
    const text = msg.value.trim(); if (!text || send.disabled) return;
    msg.value = ""; send.disabled = true;
    add("me", (pendingFile ? '<div class="file-chip">📎 ' + esc(pendingFile.name) + "</div><br>" : "") + esc(text));
    const t = add("bot", '<span class="typing">Librarian is looking that up <i>●</i><i>●</i><i>●</i></span>');
    const body = { threadId, text, ...(pendingFile ? { attachment: pendingFile } : {}) };
    pendingFile = null; pend.style.display = "none"; fileIn.value = "";
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
                                           body: JSON.stringify(body) });
      const d = await r.json();
      t.querySelector(".bubble").innerHTML = renderReply(d.reply || d.error || "(no reply)") +
        '<div class="fb" data-mid="' + d.messageId + '">' +
        '<button onclick="react(this,\'thumbs_up\')">👍</button>' +
        '<button onclick="react(this,\'thumbs_down\')">👎</button></div>';
    } catch (e) { t.querySelector(".bubble").textContent = "Something went wrong: " + e; }
    send.disabled = false; msg.focus();
    chat.scrollTop = chat.scrollHeight;
  }
  window.react = async (btn, emoji) => {
    const box = btn.parentElement;
    box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    await fetch("/api/react", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ threadId, messageId: box.dataset.mid, emoji, added: true }) });
  };
  send.onclick = submit;
  msg.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  add("bot", "Hi! I'm the Librarian. Ask me anything about Northwind policies — vacation, expenses, on-call. If I don't know something, upload the document and I'll learn it." +
             '<div class="fb" style="display:none"></div>');
</script>
