  <path fill="none" stroke="#BD591F" stroke-width="4.8" stroke-linecap="round" d="M15 24h3.5a5 5 0 0 0 5-5v-2.5a5 5 0 0 1 5-5H34M18.5 24a5 5 0 0 1 5 5v1.5a5 5 0 0 0 5 5H34" />
